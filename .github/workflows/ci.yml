name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # 2.1.287 added mods and is the oldest release the README supports.
        claude: ["2.1.287", "stable"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code ${{ matrix.claude }} (native)
        run: curl -fsSL https://claude.ai/install.sh | bash -s ${{ matrix.claude }}
      - name: Version
        run: ~/.local/bin/claude --version
      - name: Validate
        run: ~/.local/bin/claude plugin validate .
      - name: Test
        run: ~/.local/bin/claude plugin test .
